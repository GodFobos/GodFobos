name: biomonitor

# Renders assets for the profile README from live GitHub data and publishes
# them to the `output` branch, so the default branch history stays clean.
on:
  schedule:
    - cron: "17 3 * * *"   # daily, 06:17 Moscow time
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "tools/**"
      - ".github/workflows/stats.yml"

permissions:
  contents: write

concurrency:
  group: biomonitor
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install renderer deps
        run: pip install fonttools==4.*

      - name: Render stats
        run: python tools/stats.py --user "${{ github.repository_owner }}" --out out/stats.svg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional: a fine-grained PAT stored as STATS_TOKEN, if GITHUB_TOKEN
          # ever stops being allowed to read contribution data.
          STATS_TOKEN: ${{ secrets.STATS_TOKEN }}

      - name: Publish to output branch
        working-directory: out
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init -q -b output
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stats.svg
          git commit -q -m "biomonitor: refresh stats"
          git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git" output
